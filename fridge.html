<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="maomaoyulin 的小岛冰箱，查看冷藏室与冷冻室。" />
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./fridge.css" />
    <title>小岛冰箱 · maomaoyulin</title>
</head>
<body>
    <nav class="top-nav" aria-label="个人网站导航">
        <a href="./index.html">🏠 首页</a>
        <a href="./diary.html">🌿 读研日记</a>
        <a href="./book-of-answers/">📖 答案之书</a>
        <a href="./fridge.html" class="active" aria-current="page">🧊 冰箱</a>
    </nav>

    <main class="fridge-page">
        <section class="fridge-app" aria-live="polite">
            <div class="scene-panel">
                <div class="scene-toolbar">
                    <button class="round-button back-button" type="button" aria-label="返回整台冰箱" title="返回整台冰箱">←</button>
                    <span class="toolbar-spacer"></span>
                    <button class="round-button sound-button" type="button" aria-label="切换冰箱提示音" aria-pressed="true" title="提示音：开">♪</button>
                </div>

                <div class="fridge-stage" id="fridgeStage">
                    <div class="floor-shadow" aria-hidden="true"></div>

                    <div class="fridge-front" id="fridgeFront" aria-label="一台立式老式灰色双门冰箱">
                        <div class="control-deck" aria-hidden="true">
                            <span class="deck-brand"><i>🍃</i> MAOMAO</span>
                            <span class="deck-light"></span>
                            <span class="deck-screen">05°C&nbsp;&nbsp; -18°C</span>
                            <span class="deck-button"></span>
                        </div>
                        <div class="door-cavity upper-cavity" aria-hidden="true">
                            <span class="cavity-lamp"></span>
                            <span class="cavity-shelf shelf-a"></span>
                            <span class="cavity-shelf shelf-b"></span>
                            <span class="cavity-bin"></span>
                        </div>
                        <button class="fridge-door upper-door" type="button" data-open="upper" aria-label="打开上层冷藏室">
                            <span class="door-front-face">
                                <span class="leaf-magnet">🍃</span>
                                <span class="flower-magnet">🌼</span>
                                <span class="face-magnet">ᵔᴥᵔ</span>
                                <span class="door-note">今天也要<br /><small>好好吃饭!</small></span>
                                <span class="door-handle"></span>
                                <span class="door-label"><b>冷藏室</b><small>点击打开</small></span>
                            </span>
                            <span class="door-back-face" aria-hidden="true"></span>
                        </button>
                        <div class="door-cavity lower-cavity" aria-hidden="true">
                            <span class="mini-freezer-drawer"></span>
                            <span class="mini-freezer-drawer"></span>
                            <span class="mini-freezer-drawer"></span>
                        </div>
                        <button class="fridge-door lower-door" type="button" data-open="lower" aria-label="打开下层冷冻室">
                            <span class="door-front-face">
                                <span class="door-handle"></span>
                                <span class="energy-sticker"><i>🌱</i><b>新鲜住民</b><small>KEEP IT FRESH</small></span>
                                <span class="door-label"><b>冷冻室</b><small>点击打开</small></span>
                            </span>
                            <span class="door-back-face" aria-hidden="true"></span>
                        </button>
                        <span class="fridge-foot foot-left"></span>
                        <span class="fridge-foot foot-right"></span>
                    </div>

                    <div class="interior-view upper-interior" id="upperInterior" aria-hidden="true">
                        <div class="cold-chamber">
                            <div class="lamp"><span></span></div>
                            <div class="thermostat"><span></span><span></span><span></span></div>
                            <div class="glass-shelf shelf-one"></div>
                            <div class="glass-shelf shelf-two"></div>
                            <div class="crisper-drawer"><span>FRESH BOX</span></div>
                        </div>
                        <div class="door-liner">
                            <div class="door-rack top-rack"></div>
                            <div class="door-rack split-rack"><i></i></div>
                            <div class="door-rack bottom-rack"></div>
                        </div>
                    </div>

                    <div class="interior-view lower-interior" id="lowerInterior" aria-hidden="true">
                        <div class="freezer-shell">
                            <div class="frost-mark">❄</div>
                            <div class="freezer-drawer"><span>FREEZER BOX · 01</span><i></i></div>
                            <div class="freezer-drawer"><span>FREEZER BOX · 02</span><i></i></div>
                            <div class="freezer-drawer"><span>FREEZER BOX · 03</span><i></i></div>
                        </div>
                    </div>

                    <div class="stage-hint" id="stageHint">
                        <span>👆</span>
                        <p>点击上门或下门<br />看看里面吧</p>
                    </div>
                </div>

            </div>

            <button class="inventory-toggle" id="inventoryToggle" type="button" aria-controls="inventoryPanel" aria-expanded="false">
                <span>🧺</span><strong>冰箱里有什么</strong><b>0</b>
            </button>
            <div class="inventory-backdrop" id="inventoryBackdrop"></div>

            <aside class="inventory-panel" id="inventoryPanel" aria-hidden="true">
                <div class="inventory-heading">
                    <span class="inventory-icon">🧺</span>
                    <div>
                        <small>MY FRIDGE LIST</small>
                        <h2>冰箱里有什么</h2>
                    </div>
                    <span class="item-count" id="itemCount">0</span>
                    <button class="inventory-close" id="inventoryClose" type="button" aria-label="收起冰箱清单">×</button>
                </div>

                <div class="temperature-card" aria-label="区域温度信息">
                    <div><span>当前区域</span><strong id="areaName">全部</strong></div>
                    <div><span>建议温度</span><strong id="temperature">—</strong></div>
                </div>

                <div class="empty-inventory">
                    <div class="empty-basket" aria-hidden="true"><span></span><i></i><i></i><i></i></div>
                    <strong>冰箱还是空空的</strong>
                    <p id="emptyMessage">选择一个区域，之后这里会显示存放的食材。</p>
                </div>

                <div class="future-slots" aria-label="预留的食材栏位">
                    <div class="slot"><small>栏位 01</small><span>等待食材</span><b>＋</b></div>
                    <div class="slot"><small>栏位 02</small><span>等待食材</span><b>＋</b></div>
                    <div class="slot"><small>栏位 03</small><span>等待食材</span><b>＋</b></div>
                    <div class="slot"><small>栏位 04</small><span>等待食材</span><b>＋</b></div>
                </div>
                <p class="inventory-note">第二阶段可在这里加入食材名称、数量与保质期。</p>
            </aside>
        </section>
    </main>

    <script src="./fridge.js"></script>
</body>
</html>
