<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/favicon.ico" />
    <title>读研日记 · maomaoyulin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet"
    />

    <style>
        :root {
            --animal-primary: #19c8b9;
            --animal-primary-dark: #0fa395;
            --animal-text: #725d42;
            --animal-text-soft: #7c5734;
            --animal-bg-soft: #faf8f3;
            --animal-border: #e8e2d6;
            --animal-card: #fff;
            --animal-shadow: 0 4px 12px rgba(114, 93, 66, 0.08);
            --animal-shadow-hover: 0 8px 24px rgba(114, 93, 66, 0.15);
            --animal-radius: 18px;
            --animal-radius-lg: 24px;

            --cat-life: #e6f9f6; --cat-life-text: #19c8b9;
            --cat-tech: #f0e8d8; --cat-tech-text: #a08060;
            --cat-mood: #fde8e7; --cat-mood-text: #d35a55;
            --cat-food: #fff0d6; --cat-food-text: #c08240;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
        body {
            font-family: "Nunito", "Noto Sans SC", "Zen Maru Gothic",
                -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--animal-text);
            background: url("./assets/home_bg.webp") 0 0 / auto repeat, #7DC395;
            animation: bgScroll 80s linear infinite;
            overflow-x: hidden;
        }
        @keyframes bgScroll {
            0%   { background-position: 100% 0%; }
            100% { background-position: 0% 100%; }
        }
        *::-webkit-scrollbar { display: none; }
        html { scrollbar-width: none; }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        /* Top Nav */
        .top-nav {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%); z-index: 50;
            display: flex; gap: 8px;
            background: rgba(255, 252, 244, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(232, 226, 214, 0.6);
            border-radius: 999px; padding: 6px;
            box-shadow: 0 4px 16px rgba(114, 93, 66, 0.1);
            white-space: nowrap;
        }
        .top-nav a {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 999px;
            font-size: 13px; font-weight: 700; color: var(--animal-text-soft);
            transition: background 0.2s ease, color 0.2s ease;
        }
        .top-nav a:hover { background: #f0e8d8; color: var(--animal-text); }
        .top-nav a.active { background: var(--animal-primary); color: #fff; }

        /* Page Hero */
        .page-hero {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 38vh;
            padding: 100px 40px 28px; text-align: center;
        }
        .page-hero-eyebrow {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 700;
            padding: 4px 12px; border-radius: 12px;
            background: #e6f9f6; color: #19c8b9;
            margin-bottom: 14px;
        }
        .page-hero-title {
            font-family: "Nunito", "Zen Maru Gothic", sans-serif;
            font-size: 56px; font-weight: 800; line-height: 1.1;
            color: #fff9e6; text-shadow: 0 4px 1px rgba(0, 0, 0, 0.4);
            margin: 0 0 12px;
        }
        .page-hero-subtitle {
            font-size: 15px; color: rgba(255, 249, 230, 0.95); line-height: 1.7;
            max-width: 580px; margin: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        /* Toolbar */
        .toolbar {
            max-width: 880px; margin: 0 auto; padding: 0 40px 18px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
        }
        .toolbar-info {
            font-size: 13px; color: rgba(255, 249, 230, 0.9);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); font-weight: 600;
        }
        .toolbar-info b { color: #fff9e6; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: inherit; font-weight: 700; font-size: 14px; line-height: 1;
            padding: 10px 18px; border-radius: 14px; border: none; cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            user-select: none; white-space: nowrap;
        }
        .btn-primary {
            background: var(--animal-primary); color: #fff;
            box-shadow: 0 4px 0 #0fa395, 0 6px 12px rgba(25, 200, 185, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(2px); }
        .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 12px; }

        /* List */
        .list {
            max-width: 880px; margin: 0 auto; padding: 0 40px 60px;
            display: flex; flex-direction: column; gap: 18px;
        }
        .diary-card {
            background: var(--animal-card);
            border: 1px solid var(--animal-border);
            border-radius: var(--animal-radius); padding: 22px 26px;
            display: grid; grid-template-columns: 92px 1fr; gap: 20px;
            align-items: start;
            box-shadow: var(--animal-shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }
        .diary-card:hover { transform: translateY(-3px); box-shadow: var(--animal-shadow-hover); }
        .date-block {
            text-align: center; background: var(--animal-bg-soft);
            border-radius: 14px; padding: 12px 6px;
            border: 1px solid var(--animal-border);
        }
        .date-block .month { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--animal-primary); }
        .date-block .day { font-family: "Nunito", sans-serif; font-size: 28px; font-weight: 900; color: var(--animal-text); line-height: 1; margin-top: 2px; }
        .date-block .year { font-size: 10px; color: var(--animal-text-soft); margin-top: 4px; font-weight: 600; }
        .diary-body { display: flex; flex-direction: column; min-width: 0; }
        .diary-title { font-size: 18px; font-weight: 800; color: var(--animal-text); margin: 0 0 8px; line-height: 1.4; }
        .diary-excerpt {
            font-size: 14px; color: var(--animal-text-soft); line-height: 1.7;
            margin: 0 0 14px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
        }
        .diary-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .cat-chip {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 12px; font-weight: 700;
            padding: 4px 12px; border-radius: 999px;
        }
        .cat-chip.life  { background: var(--cat-life);  color: var(--cat-life-text); }
        .cat-chip.tech  { background: var(--cat-tech);  color: var(--cat-tech-text); }
        .cat-chip.mood  { background: var(--cat-mood);  color: var(--cat-mood-text); }
        .cat-chip.food  { background: var(--cat-food);  color: var(--cat-food-text); }
        .cat-chip.other { background: #ece6f5; color: #8870c4; }
        .read-more { font-size: 13px; font-weight: 700; color: var(--animal-primary); }

        /* Empty / Loading */
        .empty, .loading {
            text-align: center; padding: 80px 24px;
            background: var(--animal-card);
            border: 2px dashed var(--animal-border);
            border-radius: var(--animal-radius-lg);
            color: var(--animal-text-soft);
        }
        .empty-icon, .loading-icon { font-size: 56px; margin-bottom: 12px; }
        .empty-title { font-size: 17px; font-weight: 800; color: var(--animal-text); margin-bottom: 6px; }
        .empty-desc  { font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
        .loading-icon { animation: spin 1.4s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Admin floating button */
        .admin-fab {
            position: fixed; bottom: 24px; right: 24px;
            z-index: 60;
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 13px; font-weight: 700;
            background: var(--animal-card);
            color: var(--animal-text);
            border: 1px solid var(--animal-border);
            box-shadow: var(--animal-shadow);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .admin-fab:hover { transform: translateY(-2px); box-shadow: var(--animal-shadow-hover); }
        .admin-fab.logged {
            background: #e6f9f6; color: var(--animal-primary);
            border-color: rgba(25, 200, 185, 0.3);
        }
        .admin-fab .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #a0a0a0; display: inline-block;
        }
        .admin-fab.logged .dot { background: var(--animal-primary); }

        /* Admin token modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: center; justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            background: var(--animal-card);
            border-radius: var(--animal-radius-lg);
            border: 1px solid var(--animal-border);
            padding: 28px 30px; max-width: 360px; width: 100%;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        }
        .modal-icon { font-size: 36px; margin-bottom: 6px; }
        .modal-title { font-size: 17px; font-weight: 800; color: var(--animal-text); margin: 0 0 6px; }
        .modal-desc { font-size: 13px; color: var(--animal-text-soft); line-height: 1.6; margin: 0 0 16px; }
        .modal-form { display: flex; flex-direction: column; gap: 10px; }
        .modal-form input {
            width: 100%; font-family: inherit; font-size: 14px;
            color: var(--animal-text); background: var(--animal-bg-soft);
            border: 1.5px solid var(--animal-border);
            border-radius: 12px; padding: 10px 14px;
            outline: none;
        }
        .modal-form input:focus { border-color: var(--animal-primary); background: #fff; }
        .modal-error {
            font-size: 12px; color: #d35a55; background: #fde8e7;
            padding: 6px 10px; border-radius: 8px;
            display: none;
        }
        .modal-error.show { display: block; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }

        /* Footer */
        .footer { padding: 32px 40px; text-align: center; font-size: 12px; color: rgba(255, 249, 230, 0.9); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; }
        .footer-link { font-size: 13px; color: #fff9e6; cursor: pointer; font-weight: 600; transition: opacity 0.2s ease; }
        .footer-link:hover { opacity: 0.7; }

        @media (max-width: 768px) {
            .page-hero-title { font-size: 38px; }
            .page-hero-subtitle { font-size: 13px; }
            .toolbar, .list { padding-left: 16px; padding-right: 16px; }
            .diary-card { grid-template-columns: 72px 1fr; padding: 18px; gap: 14px; }
            .date-block .day { font-size: 24px; }
            .admin-fab { bottom: 16px; right: 16px; }
        }
        @media (max-width: 390px) {
            .top-nav { top: 12px; gap: 2px; padding: 5px; }
            .top-nav a { gap: 3px; padding: 5px 7px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="./index.html">🏠 首页</a>
        <a href="./diary.html" class="active">🌿 读研日记</a>
        <a href="./book-of-answers/">📖 答案之书</a>
    </nav>

    <!-- Admin login modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <div class="modal-icon" id="adminIcon">🔑</div>
            <h2 class="modal-title" id="adminTitle">管理员登录</h2>
            <p class="modal-desc" id="adminDesc">只有你能写/编辑/删除日记。<br />输入密码解锁管理权限。</p>
            <form class="modal-form" id="adminForm">
                <input type="password" id="adminTokenInput" placeholder="管理员密码" autocomplete="off" />
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost btn-sm" id="adminCancel">取消</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="adminSubmit">登录</button>
                </div>
                <div class="modal-error" id="adminError"></div>
            </form>
        </div>
    </div>

    <div class="page-hero">
        <div class="page-hero-eyebrow">
            <span>📖</span> MY DIARY · 读研记录
        </div>
        <h1 class="page-hero-title">读研记录</h1>
        <p class="page-hero-subtitle">
            记录读研路上零零碎碎的想法、读到的论文、踩过的坑、和偶尔的好天气。<br />
            <small style="opacity: 0.85;">公开阅读 · 云端同步</small>
        </p>
    </div>

    <div class="toolbar">
        <div class="toolbar-info">
            共 <b id="entryCount">0</b> 篇 ·
            最近更新 <b id="lastUpdate">--</b>
        </div>
        <button class="btn btn-primary btn-sm" id="btnNew">✏️ 写新日记</button>
    </div>

    <div class="list" id="entryList"></div>

    <!-- Admin FAB -->
    <button class="admin-fab" id="adminFab">
        <span class="dot"></span>
        <span id="adminFabText">🔑 管理员登录</span>
    </button>

    <footer class="footer">
        <div class="footer-links">
            <a class="footer-link" href="./index.html">首页</a>
            <a class="footer-link" href="./diary.html">读研日记</a>
            <a class="footer-link" href="./book-of-answers/">答案之书</a>
            <a class="footer-link" href="mailto:1329106053@qq.com">Email</a>
        </div>
        <div>© 2026 maomaoyulin · 公开阅读 · Cloudflare D1</div>
    </footer>

    <script>
        // ============================================
        // Token 管理（写操作需要）
        // ============================================
        const TOKEN_KEY = "diary:token";
        function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
        function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
        function clearToken() { localStorage.removeItem(TOKEN_KEY); }
        function isAdmin() { return !!getToken(); }

        // ============================================
        // API
        // ============================================
        const API_BASE = "/api";
        async function apiGet(path = "") {
            const r = await fetch(API_BASE + "/entries" + path);
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        }
        async function apiWrite(method, path, body) {
            // 写操作：必须先有 token
            if (!isAdmin()) {
                throw new Error("NEED_LOGIN");
            }
            const r = await fetch(API_BASE + "/entries" + path, {
                method,
                headers: {
                    "Content-Type": "application/json",
                    Authorization: "Bearer " + getToken(),
                },
                body: body ? JSON.stringify(body) : undefined,
            });
            if (r.status === 401) { clearToken(); throw new Error("NEED_LOGIN"); }
            if (!r.ok) {
                const t = await r.text();
                throw new Error(t || "HTTP " + r.status);
            }
            return r.json();
        }

        // ============================================
        // 工具
        // ============================================
        const CATEGORIES = {
            life:  { label: "生活日常", cls: "life"  },
            tech:  { label: "技术折腾", cls: "tech"  },
            mood:  { label: "心情随笔", cls: "mood"  },
            food:  { label: "吃喝记录", cls: "food"  },
            other: { label: "其它",     cls: "other" },
        };
        function fmtDate(iso) {
            const d = new Date(iso + "T00:00:00");
            const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            return { month: MONTHS[d.getMonth()], day: d.getDate(), year: d.getFullYear() };
        }
        function fmtLastUpdate(ts) {
            if (!ts) return "--";
            const d = new Date(ts);
            const pad = (n) => String(n).padStart(2, "0");
            return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function makeExcerpt(content, max = 80) {
            const t = (content || "").replace(/\s+/g, " ").trim();
            return t.length > max ? t.slice(0, max) + "…" : t;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[c]));
        }

        // ============================================
        // Admin 登录弹窗 + FAB
        // ============================================
        const adminModal = document.getElementById("adminModal");
        const adminForm = document.getElementById("adminForm");
        const adminTokenInput = document.getElementById("adminTokenInput");
        const adminError = document.getElementById("adminError");
        const adminFab = document.getElementById("adminFab");
        const adminFabText = document.getElementById("adminFabText");
        const adminTitle = document.getElementById("adminTitle");
        const adminDesc = document.getElementById("adminDesc");
        const adminIcon = document.getElementById("adminIcon");

        let adminResolve = null;
        function showAdminLogin() {
            return new Promise((resolve) => {
                adminResolve = resolve;
                adminIcon.textContent = "🔑";
                adminTitle.textContent = "管理员登录";
                adminDesc.innerHTML = "只有你能写 / 编辑 / 删除日记。<br />输入密码解锁管理权限。";
                adminTokenInput.value = "";
                adminError.classList.remove("show");
                adminModal.classList.add("show");
                setTimeout(() => adminTokenInput.focus(), 100);
            });
        }
        function hideAdminLogin() {
            adminModal.classList.remove("show");
            adminResolve = null;
        }
        function showAdminError(msg) {
            adminError.textContent = msg;
            adminError.classList.add("show");
        }
        adminForm.addEventListener("submit", (e) => {
 e.preventDefault();
 const t = adminTokenInput.value.trim();
 if (!t) return showAdminError("请输入密码");
 setToken(t);
 hideAdminLogin();
 refreshAdminFab();
 if (adminResolve) adminResolve(true);
 });
        document.getElementById("adminCancel").onclick = () => {
            hideAdminLogin();
            if (adminResolve) adminResolve(false);
        };

        function refreshAdminFab() {
            if (isAdmin()) {
                adminFab.classList.add("logged");
                adminFabText.textContent = "管理员已登录 ✓";
            } else {
                adminFab.classList.remove("logged");
                adminFabText.textContent = "🔑 管理员登录";
            }
        }
        adminFab.onclick = async () => {
            if (isAdmin()) {
                // 已登录：点一下退出
                if (confirm("退出管理员登录？")) {
                    clearToken();
                    refreshAdminFab();
                }
            } else {
                await showAdminLogin();
                refreshAdminFab();
            }
        };

        async function requireAdmin() {
            if (isAdmin()) return true;
            await showAdminLogin();
            return isAdmin();
        }

        // ============================================
        // 渲染
        // ============================================
        const entryList = document.getElementById("entryList");
        const entryCount = document.getElementById("entryCount");
        const lastUpdate = document.getElementById("lastUpdate");

        async function loadEntries() {
            entryList.innerHTML = `
                <div class="loading">
                    <span class="loading-icon">🌿</span>
                    <div class="empty-title">加载中...</div>
                </div>
            `;
            try {
                const data = await apiGet("");
                allEntries = data.entries || [];
                render();
            } catch (err) {
                entryList.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-desc">${escapeHtml(err.message)}</div>
                        <button class="btn btn-primary btn-sm" onclick="loadEntries()">🔄 重试</button>
                    </div>
                `;
            }
        }

        let allEntries = [];
        function render() {
            const entries = allEntries.slice().sort((a, b) =>
                (b.date || "").localeCompare(a.date || "") ||
                (b.updatedAt || 0) - (a.updatedAt || 0)
            );
            entryCount.textContent = entries.length;
            const latest = entries.reduce((m, e) => Math.max(m, e.updatedAt || 0), 0);
            lastUpdate.textContent = fmtLastUpdate(latest);

            if (entries.length === 0) {
                entryList.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🌱</div>
                        <div class="empty-title">还没有日记</div>
                        <div class="empty-desc">还没有内容，写第一篇吧。</div>
                    </div>
                `;
            } else {
                entryList.innerHTML = entries.map((e) => {
                    const d = fmtDate(e.date);
                    const cat = CATEGORIES[e.category] || CATEGORIES.other;
                    return `
                        <a class="diary-card" href="./diary-detail.html?id=${encodeURIComponent(e.id)}">
                            <div class="date-block">
                                <div class="month">${d.month}</div>
                                <div class="day">${d.day}</div>
                                <div class="year">${d.year}</div>
                            </div>
                            <div class="diary-body">
                                <h3 class="diary-title">${escapeHtml(e.title || "")}</h3>
                                <p class="diary-excerpt">${escapeHtml(makeExcerpt(e.content))}</p>
                                <div class="diary-meta">
                                    <span class="cat-chip ${cat.cls}">${escapeHtml(cat.label)}</span>
                                    <span class="read-more">阅读全文 →</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join("");
            }
        }

        document.getElementById("btnNew").onclick = async () => {
            if (await requireAdmin()) {
                window.location.href = "./diary-detail.html?new=1";
            }
        };

        // ============================================
        // 启动
        // ============================================
        refreshAdminFab();
        loadEntries();
    </script>
</body>
</html>
